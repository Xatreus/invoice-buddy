[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-buddy"
version = "0.1.0"
description = "AI-powered invoice processing assistant"
requires-python = ">=3.14"
dependencies = [
       "pydantic>=2.13.5",
       "sqlalchemy>=2.0.54",
       "pymupdf>=1.28.2",
       "openai>=1.0",
       "python-dotenv>=1.2.3",
       "fastapi>=0.117.1",
       "uvicorn>=0.36.0",
       "python-multipart",
       "chromadb>=1.5.9",
       "sentence-transformers>=6.1.0",
]
[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]