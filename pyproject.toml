[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-buddy"
version = "0.1.0"
description = "AI-powered invoice processing assistant"
requires-python = ">=3.14"
dependencies = [
       "pydantic>=2.13.5",
]
[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]